name: etsy_pod_pipeline
title: Etsy POD Pipeline
description: A complete Etsy pipeline an agent can walk a human through end to end, across six shop types (print-on-demand apparel, personalised pet accessories, digital design/pattern downloads, digital templates for planners/resumes/business, original 3D-print STL files, and coloring books) chosen from ready-made presets, starting from the shop the user already has. The flow opens with an intake (shop? product?) and branches — no shop routes once to a human-hands creation appendix; no product routes to the preset's creation path (research, design brief, original production to spec, pricing, SEO listing pack, publish gate). Includes a repeatable due-diligence research stage with a scored candidate rubric (hard IP gate), an existing-shop health check where identity, banking and tax stay in the human's hands only, Printify connection for physical types via a token the human enters in the connect flow (never in chat, never in the repo), niche research that replicates validated demand without ever copying artwork (full IP/trademark checklist), original-only design rules with a by-eye QC gate per shop type, product construction priced by a tested calculator running Etsy's full verified fee stack (US$0.20 listing, 6.5% transaction, Canada 0.50% regulatory, 3%/4% + $0.25 processing, Offsite Ads 15%/12% capped at $100 — verified 2026-11-23 from Etsy's official pages), a listing-pack generator with an SEO audit built to Etsy's real limits and current Seller Handbook guidance (title 140 chars with the 2026 title rules, 13 tags × 20 chars, attributes, description keywords, AI disclosure when applicable, IP tripwire; digital ≤5 files × 20 MB, no variations), a publish gate that requires the human's explicit approval of the exact product and pack followed by a live read-back, an orders-and-care stage with a weekly review loop and kill criteria, and the mixed model — affiliate picks (Amazon Associates / Etsy Affiliates) promoted off Etsy only, never inside listings or messages, with the programs' disclosure and cookie rules documented from primary sources. Ships with a worked starter plan for motivational apparel under the RiseOrConquer brand, dated market findings for all six shop types (2026-11-23, sourced; STL price bands recorded as unverified estimates), and a preset picker (pipeline/presets.py) whose presets are validated to drive the pricing and listing tools and to carry affiliate picks and a creation path. Use when the user wants to start or run an Etsy shop with this repo, pick a shop type, create a product, price a product, build an Etsy listing pack, or audit a shop's margins. Do NOT use for creating a shop or entering any credential on the user's behalf, for publishing without the user's explicit approval of the exact item, for trademarked or copied designs, for affiliate links inside Etsy, or with any promise of revenue or sales.
include_in_prompt: true
availability:
  confidential_vm: true
  needs_speech: false
